<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PickPrime AI Video Maker</title>

  <meta name="description" content="Create AI videos with PickPrime AI Video Maker.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: linear-gradient(135deg, #6d28d9, #2563eb);
      color: white;
      padding: 24px 18px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 7px;
      opacity: .9;
      font-size: 14px;
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    textarea,
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .loading {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
    }

    video {
      width: 100%;
      border-radius: 14px;
      margin-top: 15px;
      background: black;
    }

    .download {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 12px;
      padding: 13px;
      border-radius: 11px;
      background: #111827;
      color: white;
      font-weight: 700;
    }

    .example {
      font-size: 13px;
      color: #6b7280;
      margin-top: -8px;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">✨ PickPrime AI</div>
    <div class="tagline">AI Video Maker</div>
  </header>

  <main class="container">

    <div class="card">

      <label for="prompt">Describe your video</label>

      <textarea
        id="prompt"
        placeholder="Example: A cinematic sunset over the mountains, realistic camera movement, beautiful sky..."
      ></textarea>

      <div class="example">
        English prompts usually give better results.
      </div>

      <div class="row">

        <div>
          <label for="ratio">Aspect Ratio</label>

          <select id="ratio">
            <option value="16:9">16:9 Landscape</option>
            <option value="9:16">9:16 Portrait</option>
            <option value="1:1">1:1 Square</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
          </select>
        </div>

        <div>
          <label for="duration">Duration</label>

          <select id="duration">
            <option value="5">5 Seconds</option>
            <option value="10">10 Seconds</option>
            <option value="15">15 Seconds</option>
          </select>
        </div>

      </div>

      <button id="generateBtn" onclick="generateVideo()">
        🎬 Generate Video
      </button>

      <div id="status" class="status"></div>

    </div>


    <div class="card" id="resultCard" style="display:none;">

      <h3>🎥 Your AI Video</h3>

      <video id="video" controls playsinline></video>

      <a
        id="download"
        class="download"
        target="_blank"
        rel="noopener"
      >
        ⬇️ Open / Download Video
      </a>

    </div>

  </main>


  <footer>
    © 2026 PickPrime AI<br>
    Contact: pickprimehelp@gmail.com
  </footer>


<script>

async function generateVideo() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const ratio =
    document.getElementById("ratio").value;

  const duration =
    Number(document.getElementById("duration").value);

  const button =
    document.getElementById("generateBtn");

  const status =
    document.getElementById("status");

  const resultCard =
    document.getElementById("resultCard");

  const video =
    document.getElementById("video");

  const download =
    document.getElementById("download");


  if (!prompt) {

    showError("Please enter a video prompt.");

    return;
  }


  button.disabled = true;

  button.textContent = "⏳ Generating...";

  resultCard.style.display = "none";

  showLoading(
    "Sending request to PickPrime AI...\nPlease wait."
  );


  try {

    const response = await fetch(
      "/api/generate",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          prompt: prompt,
          duration: duration,
          ratio: ratio,
          resolution: "720P"
        })
      }
    );


    const text = await response.text();


    let data;

    try {
      data = JSON.parse(text);
    } catch (e) {

      throw new Error(
        "Server returned invalid response:\n\n" +
        text.substring(0, 1000)
      );

    }


    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        data.error ||
        "Video generation failed"
      );

    }


    if (!data.video) {

      throw new Error(
        "Cloudflare did not return a video URL."
      );

    }


    video.src = data.video;

    download.href = data.video;

    resultCard.style.display = "block";

    showSuccess(
      "✅ Video generated successfully!"
    );


    resultCard.scrollIntoView({
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);

    showError(
      "❌ Sending request failed\n\n" +
      (error.message || error)
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "🎬 Generate Video";

  }

}


function showLoading(message) {

  const status =
    document.getElementById("status");

  status.className =
    "status loading";

  status.textContent =
    message;

}


function showError(message) {

  const status =
    document.getElementById("status");

  status.className =
    "status error";

  status.textContent =
    message;

}


function showSuccess(message) {

  const status =
    document.getElementById("status");

  status.className =
    "status success";

  status.textContent =
    message;

}

</script>

</body>
</html>
